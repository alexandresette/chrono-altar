<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080b0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#c8972a"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0d11"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="11" fill="none"
        stroke="#c8972a" stroke-width="1.5" opacity="0.7"/>

  <!-- Radial glow -->
  <circle cx="32" cy="26" r="28" fill="url(#glow)"/>

  <!-- Clock ring -->
  <circle cx="32" cy="26" r="20" fill="none" stroke="#c8972a"
          stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- Cross glow layer -->
  <line x1="32" y1="8" x2="32" y2="46"
        stroke="#c8972a" stroke-width="8" stroke-linecap="round"
        filter="url(#blur)" opacity="0.4"/>
  <line x1="19" y1="20" x2="45" y2="20"
        stroke="#c8972a" stroke-width="8" stroke-linecap="round"
        filter="url(#blur)" opacity="0.4"/>

  <!-- Cross main -->
  <line x1="32" y1="8" x2="32" y2="46"
        stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <line x1="19" y1="20" x2="45" y2="20"
        stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Cross highlight -->
  <line x1="32" y1="8" x2="32" y2="46"
        stroke="#fff8e0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Altar base -->
  <rect x="20" y="48" width="24" height="5" rx="2" fill="url(#gold)" opacity="0.9"/>
  <rect x="16" y="55" width="32" height="4" rx="2" fill="#7a5b18" opacity="0.8"/>
</svg>
